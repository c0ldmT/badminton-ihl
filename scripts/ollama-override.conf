# systemd-Drop-in für den Ollama-Dienst.
# Installation (siehe README Abschnitt 6.1):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp scripts/ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
[Service]
# OpenCode braucht >= 64k Kontext (Ollama-Default bei < 24 GB VRAM: nur 4k).
# OpenCode und Autopilot sprechen beide über /v1 -> gleicher Kontext -> kein Modell-Reload.
Environment="OLLAMA_CONTEXT_LENGTH=65536"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Nur ein Modell im Speicher, nur eine Anfrage parallel (der Loop ist sequenziell;
# jede weitere parallele Anfrage würde zusätzlichen KV-Cache reservieren).
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
# Modell zwischen Coder-Schritten (npm install, Tests, Build) nicht entladen.
Environment="OLLAMA_KEEP_ALIVE=30m"
